<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHTINCASH - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="logo.png" alt="Yachtincash Logo" class="logo-img">
                <h2>YACHTINCASH 🐳</h2>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required placeholder="Digite seu e-mail">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <div class="password-field">
                        <input type="password" id="password" required placeholder="Digite sua senha">
                        <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar senha">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <div class="link-text">
                Não tem uma conta? <a href="register.html">Cadastre-se (Ganhe R$ 5,00)</a>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
