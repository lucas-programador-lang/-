<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHTINCASH - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="logo.png" alt="Yachtincash Logo" class="logo-img">
                <h2>YACHTINCASH 🐳</h2>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Nome completo</label>
                    <input type="text" id="username" required placeholder="Digite seu nome completo">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="password" required placeholder="Digite sua senha">
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <div class="link-text">
                Não tem uma conta? <a href="register.html">Cadastre-se (Ganhe R$ 5,00)</a>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
