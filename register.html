<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHTINCASH - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="logo.png" alt="Yachtincash Logo" class="logo-img">
                <h2>Criar Conta 🐳</h2>
                <p style="font-size: 13px; color: #20b2aa;">Ganhe R$ 5,00 grátis no cadastro!</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="regUser" required placeholder="Escolha um usuário">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="regPass" required placeholder="Crie uma senha">
                </div>
                <button type="submit" class="btn">Cadastrar</button>
            </form>
            <div class="link-text">
                Já tem uma conta? <a href="login.html">Faça login</a>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
